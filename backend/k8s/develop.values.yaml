app:
  name: backend-boilerplate
  configMap: ["develop-backend-boilerplate-map"]
  secretRef: ["develop-backend-boilerplate-secret", "develop-db-secret"]

image:
  repository: <account-id>.dkr.ecr.<region>.amazonaws.com/backend-boilerplate
  pullPolicy: Always
  tag: develop

probe:
  path: ["/health-check"]

service:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP

services:
  ingress:
    enabled: false
