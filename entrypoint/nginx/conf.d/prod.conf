server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 1m;

  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "frame-ancestors 'self' https://discord.com https://*.discord.com https://*.discordsays.com" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /api/health { proxy_pass http://backend:8080/health; }
  location /socket.io/ {
    proxy_pass http://backend:8080/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }
  location /join/ {
    proxy_pass http://backend:8080/join/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Referral links: the same, for Refer & earn.
  location /r/ {
    proxy_pass http://backend:8080/r/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proof that these links belong to the mobile app (App Links / Universal Links).
  location /.well-known/ {
    proxy_pass http://backend:8080/.well-known/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # The admin app. Consider an allow/deny list of office IPs here as well.
  location = /admin { return 301 /admin/; }
  location /admin/ { proxy_pass http://admin:80; }
  location / { proxy_pass http://frontend:80; }
}