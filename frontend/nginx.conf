server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Only our own pages and Discord (for the Discord Activity) may frame the game.
  add_header Content-Security-Policy "frame-ancestors 'self' https://discord.com https://*.discord.com https://*.discordsays.com" always;

  location / {
    # /learn is served from learn.html (its own title and description); other app paths fall back to the shell.
    try_files $uri $uri.html /index.html;
  }
}